name: computer_connect_core
description: Rust-owned Computer Connect core and its Dart binding.
publish_to: none
version: 0.1.0
environment:
  sdk: ^3.12.2
dependencies:
  # The build hook reads the target OS.
  code_assets: ^1.2.1
  ffi: ^2.1.4
  # The Dart runtime must match flutter_rust_bridge_codegen and the Rust
  # crate exactly.
  flutter_rust_bridge: 2.13.0
  # FRB generates freezed sealed classes for data-carrying Rust enums.
  freezed_annotation: ^3.1.0
  hooks: 2.0.2
  native_toolchain_rust: 1.0.4+0
dev_dependencies:
  build_runner: ^2.15.1
  freezed: ^3.2.5
