[package]
name = "cc-ffi-dart"
description = "Dart binding of the Computer Connect core (flutter_rust_bridge v2)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# The developer console's state, cache and raw HTTP operations.
diagnostics = ["cc-core/diagnostics"]
# The scripted computer of the Flutter goldens (`Core::open_with_test_desktop`).
# The build hook enables it for host builds only, which only `flutter test`
# makes; without it the test operations fail `unknown_operation`.
test-desktop = ["cc-core/test-desktop"]
# The JSON-over-C-callback ABI (`cc_open`, `cc_submit`, `cc_close`), kept for
# scratch tooling until cleanup C3.
legacy-json = ["dep:serde", "dep:serde_json"]

[dependencies]
cc-core.workspace = true
flutter_rust_bridge.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true

[lints]
workspace = true
